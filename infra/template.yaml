AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Reserva de Laboratorios — CloudFront (front en S3 + /api/* hacia API Gateway),
  Lambda (Hono) y DynamoDB. Ver docs/arquitectura.md y docs/despliegue.md.

Parameters:
  LabRoleArn:
    Type: String
    Default: ""
    Description: >
      Solo para AWS Academy Learner Lab: ARN del rol LabRole
      (arn:aws:iam::<cuenta>:role/LabRole). Déjalo vacío con una cuenta propia.

Conditions:
  UsarLabRole: !Not [!Equals [!Ref LabRoleArn, ""]]
  CrearRolPropio: !Equals [!Ref LabRoleArn, ""]

Resources:
  # ---------- Datos ----------
  TablaReservas:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: usuario, AttributeType: S }
        - { AttributeName: fechaHora, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: porUsuario
          KeySchema:
            - { AttributeName: usuario, KeyType: HASH }
            - { AttributeName: fechaHora, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # ---------- Backend ----------
  RolApi:
    Type: AWS::IAM::Role
    Condition: CrearRolPropio
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AccesoTablaReservas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TablaReservas.Arn
                  - !Sub "${TablaReservas.Arn}/index/*"

  ApiHttp:
    Type: AWS::Serverless::HttpApi

  FuncionApi:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/
      Handler: lambda.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Role: !If [UsarLabRole, !Ref LabRoleArn, !GetAtt RolApi.Arn]
      Environment:
        Variables:
          TABLA_RESERVAS: !Ref TablaReservas
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiHttp
            Path: /api/{proxy+}
            Method: ANY

  # ---------- Frontend ----------
  BucketFrontend:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ControlAccesoOrigen:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribucion:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} — reserva de laboratorios"
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend
            DomainName: !GetAtt BucketFrontend.RegionalDomainName
            OriginAccessControlId: !GetAtt ControlAccesoOrigen.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${ApiHttp}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  PoliticaBucketFrontend:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketFrontend
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${BucketFrontend.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribucion}"

Outputs:
  UrlApp:
    Description: URL pública de la aplicación
    Value: !Sub "https://${Distribucion.DomainName}"
  BucketFrontend:
    Description: Bucket donde se sube el build del frontend
    Value: !Ref BucketFrontend
  DistribucionId:
    Description: Id de CloudFront (para invalidar caché)
    Value: !Ref Distribucion
  TablaReservas:
    Description: Nombre de la tabla DynamoDB
    Value: !Ref TablaReservas
